[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "UltraPython"
version = "1.8.5"
authors = [
  { name="Abdyrahym Begenjov" },
]
description = "UltraPython: Utilities of Files, Databases, and Math"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas",
    "numpy",
    "sqlalchemy",
    "openpyxl",
    "pyarrow"
]

[project.urls]
Homepage = "https://github.com"
